[package]
name = "bastionorbit"
version = "0.1.0"
description = "Bastion Orbit — SSH tunnel manager"
authors = ["SlothLabs"]
edition = "2021"

[lib]
name = "bastionorbit_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
